# Local project id only. Does not touch the hosted project.
project_id = "novacam"

# Gateway JWT check is off for this function only.
# treso-import authenticates the caller itself: Admin JWT (requireCaller)
# or header x-treso-api-key (sha256, scope treso-import, not revoked).

[functions.treso-import]
verify_jwt = false

# Gateway JWT check is off: treso-hubspot-sync accepts an Admin user JWT
# or the service role key (hourly cron). The anon key must not pass.

[functions.treso-hubspot-sync]
verify_jwt = false
